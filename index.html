<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="7X09ZiyVNsu7fBmSbFcDUhp8I7YJw__S0yheRObnNP0" />
    <title>Hollar Ventures, LLC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #e8e8e8;
            --text-muted: #6b6b6b;
            --accent: #c9a227;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(201, 162, 39, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 162, 39, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-mark {
            width: 48px;
            height: 48px;
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.2s forwards;
        }

        .logo-mark svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: clamp(2rem, 5vw, 2.75rem);
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.4s forwards;
        }

        .tagline {
            font-size: 1.125rem;
            color: var(--text-muted);
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.6s forwards;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--accent);
            margin: 3rem auto;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.8s forwards, glow 3s ease-in-out infinite;
        }

        .footer-text {
            font-size: 0.8125rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 8px rgba(201, 162, 39, 0.3);
            }
            50% {
                box-shadow: 0 0 16px rgba(201, 162, 39, 0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-mark">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" stroke="#c9a227" stroke-width="1.5" fill="none"/>
                <path d="M24 16L32 21V31L24 36L16 31V21L24 16Z" fill="#c9a227" fill-opacity="0.15" stroke="#c9a227" stroke-width="1"/>
            </svg>
        </div>
        <h1>Hollar Ventures, LLC</h1>
        <p class="tagline">A holding company for technology ventures.</p>
        <div class="divider"></div>
        <p class="footer-text">Building the future</p>
    </div>
</body>
</html>
